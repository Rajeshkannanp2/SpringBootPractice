<html lang="en" xmlns="http://www.thymeleaf.ord">
	<head>
		<title>Employee Directory</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
    	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	</head>
	<body>
<!--		<span th:text="${employees}"/>-->
		<div class="container">
			<h3>Employee Directory</h3>
			<span sec:authentication="principal.username"></span>
<!--			<span sec:authentication="principal.authorities"></span>-->
			<div th:if="${param.logout}">
				<i>You have been logged out.</i>
			</div>
			<div class="row">
				<div class="col-lg-6">
				        <a th:href="@{/employees/showFormForAdd}" class="btn btn-primary btn-sm mb-3">
							Add Employee
						</a>			   
				 </div>
				<div class="col-lg-6 float-right align-items-end text-right">
					<form action="#" th:action="@{/logout}" method="POST" class="float-right">
			                  <input type="submit" value="Logout" class="btn btn-primary btn-sm mb-3" style="float: right;  "/>
			        </form>
				</div>
			</div>
		    
			
			
		
			<hr>
			<table class="table table-bordered table-striped">
				<thead class="table-dark">
					<tr>
						<th>First Name</th>
						<th>Last Name</th>
						<th>Mail ID</th>	
						<th>Action</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="tempEmployee : ${employees}">
						<td th:text="${tempEmployee.firstName}"/>
						<td th:text="${tempEmployee.lastName}"/>
						<td th:text="${tempEmployee.email}"/>
						<td><a th:href="@{/employees/showFormForUpdate(employeeId=${tempEmployee.id})}" class="btn btn-info btn-sm">
							Update
							</a>
							<a th:href="@{/employees/delete(employeeId=${tempEmployee.id})}" class="btn btn-info btn-sm" onclick="if (!(confirm('Are you sure you want to delete this employee?'))) return false">
							Delete
							</a>
						</td>
					</tr>	
				</tbody>
			</table>
		</div>
	</body>
</html>
